name: Backend checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: python scripts/audit_repository.py --index
      - run: python -m pytest -c pytest.ini --cov=app --cov-report=term-missing --cov-fail-under=80
      - run: python -m pip_audit -r backend/requirements-production.txt
      - run: python backend/deploy/build_release.py --version ci-${{ github.run_id }}-${{ github.run_attempt }}
